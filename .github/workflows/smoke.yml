name: CEREBRON F94 deterministic smoke
on:
  push:
    paths: ["worker/**", ".github/workflows/smoke.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python worker/optimize.py
      - uses: actions/upload-artifact@v4
        with: {name: f94-smoke-artifact, path: artifacts/optimization.json}
